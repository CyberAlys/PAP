<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Display photos</title>
  <script src="photos.js"></script>
  <script src="user-adm-ver.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const postId = sessionStorage.getItem("postId");
      // Set data-responseid on all post-level comment forms
      document.querySelectorAll('.comment-form[data-responsetype="post"]').forEach(form => {
        form.dataset.responseid = postId;
      });
    });

      function getphoto()
    {
      const id = sessionStorage.getItem("postId");
      const viwerid = sessionStorage.getItem("userid")

      loadPhotoDetails(id, viwerid);
    }
    function loadcoms()
    {
      const id = sessionStorage.getItem("postId");
      loadComments(id)
    }

  </script>
  <link href="css/photodisplay.css" rel="stylesheet">
  <style>
    .user-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    img.photo, #displayed-photo {
      max-width: 100%;
      max-height: 600px;
      height: auto;
      width: auto;
      margin: 0 auto;
      object-fit: contain;
    }

    .comment-replies {
      margin-left: 2rem; /* or try 1.5rem or 30px */
      border-left: 1px solid #ccc;
      padding-left: 1rem;
    }
  </style>
</head>

<body onload="CheckLogin(); getphoto(); loadcoms()">

<button onclick="goBack()">← go back</button>

  <div id="post-container">
    <div class="user-info">
      <label>Posted by</label>
      <img id="OP-pfp" src="" alt="Loading Photo..." style="width: 40px; height: 40px; border-radius: 50%"/>
      <h3><a id="OP-name" href="#" style="color: inherit; text-decoration: none;"></a></h3>
      <div id="post-options" class="post-options-menu" style="display: none;">
        <button class="menu-toggle">⋮</button>
        <div class="menu-dropdown" style="display: none;">
          <button class="edit-post">Edit</button>
          <button class="delete-post">Delete</button>
        </div>
      </div>
    </div>
    <p id="post-text"></p>
    <div id="photo-container">
      <img class="photo" id="displayed-photo" src="" alt="Loading photo..." />
      <p id="photo-dimensions"></p>
    </div>

    <div id="edit-post-area" style="display: none; margin-top: 1rem;">
      <textarea id="edit-post-text" rows="4" style="width: 100%;"></textarea>
      <button onclick="saveEditedPost()">Save Changes</button>
      <button onclick="cancelEdit()">Cancel</button>
    </div>

    <p id="post-date"> </p>

    <div class="like-container">
      <button id="like-button" class="like-button" aria-label="Like post">
        <span class="heart-icon">🤍</span>
      </button>
      <span id="likenumber">0</span>
    </div>


  </div>

<!-- comment textbox-->
<div class="comment-form" data-responsetype="post" data-responseid="">
  <textarea class="comment-input" placeholder="Write a comment..."></textarea>
  <button class="comment-submit">Reply</button>
</div>

<!-- comment display template-->
<template id="comment-template">
  <div class="comment" data-comment-id="">
    <div class="comment-header">
      <img src="photos/profile_pictures/Default_pfp.jpg" alt="Profile picture" class="comment-pfp" />
      <span class="comment-username"></span>
      <span class="comment-date"></span>
      <div class="comment-options-menu">
        <button class="comment-menu-toggle">⋮</button>
        <div class="comment-menu-dropdown">
          <button class="delete-comment">Delete</button>
        </div>
      </div>
    </div>
    <div class="comment-body">
      <p class="comment-text"></p>
    </div>
    <div class="comment-actions">
      <button class="reply-button">Reply</button>
    </div>
    <div class="comment-replies"></div>
  </div>
</template>

<hr>

<!-- Comments section -->
<div id="comments-section">
  <!-- Comments will be inserted dynamically here -->
</div>


<script>
  //changes the like
  document.addEventListener("DOMContentLoaded", () => {
    const likeBtn = document.getElementById("like-button");
    const heart = likeBtn.querySelector(".heart-icon");

    likeBtn.addEventListener("click", () => {
      const isLiked = likeBtn.classList.toggle("liked");
      heart.textContent = isLiked ? "💙" : "🤍";
      heart.style.transform = "scale(1.3)";
      setTimeout(() => heart.style.transform = "scale(1)", 150);
      like(isLiked);
      updateLikeCount()
    });
  });

  //checks the comment submit
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".comment-form").forEach(form => {
      const button = form.querySelector(".comment-submit");
      button.addEventListener("click", () => {
        const textarea = form.querySelector(".comment-input");
        const commenttext = textarea.value.trim();
        const responsetype = form.dataset.responsetype;
        const responseid = parseInt(form.dataset.responseid);
        const userid = parseInt(sessionStorage.getItem('userid'));

        if (!commenttext) {
          alert("Comment cannot be empty.");
          return;
        }

        // Pass only the correct field
        if (responsetype === "post") {
          submitComment({ userid, commenttext, response_postid: responseid });
        } else if (responsetype === "comment") {
          submitComment({ userid, commenttext, response_commentid: responseid });
        }
        textarea.value = ""; // clear field after submission

        //reply button handler

        const replyBtn = commentDiv.querySelector(".reply-button");
        replyBtn.addEventListener("click", () => showReplyForm(commentData.commentid));

      });
    });
  });

  document.addEventListener("DOMContentLoaded", () => {
    const toggleButton = document.querySelector(".menu-toggle");
    const dropdown = document.querySelector(".menu-dropdown");

    toggleButton?.addEventListener("click", () => {
      dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
    });

    document.querySelector(".delete-post").addEventListener("click", () => {
      if (confirm("Are you sure you want to delete this post?")) {
        deletePost();
      }
      dropdown.style.display = "none";
    });

    // Close menu if clicking outside
    document.addEventListener("click", (e) => {
      if (!document.getElementById("post-options").contains(e.target)) {
        dropdown.style.display = "none";
      }
    });
  });

  document.querySelector(".edit-post").addEventListener("click", () => {
    const currentText = document.getElementById("post-text").textContent;
    const editBox = document.getElementById("edit-post-area");
    const editInput = document.getElementById("edit-post-text");

    editInput.value = currentText;
    editBox.style.display = "block";
  });


    function goBack() {
    sessionStorage.removeItem('postId');
    window.history.back();
  }


</script>

</body>
</html>
