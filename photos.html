<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photos</title>
    <script src="user-adm-ver.js"></script>
    <script src="photos.js" ></script>
</head>
<body>

    <form id="photoupload" onsubmit="uploadpicturetophp(event)">
        <label for="Tittle">Insert A Tittle</label>
        <input type="text" placeholder="Insert a Tittle here" id="Tittle"> <br>
        <label for="img">Select image:</label>
        <input type="file" id="img" name="img" accept="image/*"> <br>
        <label for="description">Insert a Description</label>
        <input type="text" placeholder="Insert a Description here" id="description">
        <input type="submit">
    </form>

</body>
</html>
