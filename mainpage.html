<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Photographer</title>
    <link rel="stylesheet" href="css/mainpage.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <script src="user-adm-ver.js"></script>
    <script src="photos.js" defer></script>

</head>

<body onload="CheckLogin(); loadHeaderInfo();">
<div class="header">
    <button class="menu-button" onclick="toggleSidebar()">☰</button>
    <div class="logo">The Photographer</div>
    <div class="user-info">
        <span id="username">Loading...</span>
        <img id="userpfp" src="" alt="pfp" />
    </div>
</div>

<div class="sidebar" id="sidebar">
    <button onclick="loadIframe('allphotos.html')">Feed</button>
    <button onclick="loadIframe('photos.html')">Make a Post</button>
    <button onclick="openMyProfile()">Profile</button>
    <button onclick="logout()">Logout</button>
</div>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="iframe-container">
    <iframe src="allphotos.html"></iframe>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        sidebar.classList.toggle("active");
        overlay.classList.toggle("active");
    }

    function loadHeaderInfo(forceRefresh = false) {
        try {
            // If forcing refresh, clear cached values and add timestamp
            if (forceRefresh) {
                const profilepic = sessionStorage.getItem("profilepic");
                if (profilepic) {
                    // Remove any existing cache busting parameter
                    const cleanUrl = profilepic.split('?')[0];
                    sessionStorage.setItem("profilepic", cleanUrl + "?t=" + Date.now());
                }
            }

            const username = sessionStorage.getItem("username") || "User";
            const profilepic = sessionStorage.getItem("profilepic") || "defaultpfp.png";

            // Update DOM elements
            document.getElementById("username").textContent = username;

            const pfpElement = document.getElementById("userpfp");
            if (forceRefresh) {
                // Force refresh by adding timestamp if not already present
                pfpElement.src = profilepic.includes('?') ? profilepic : profilepic + "?t=" + Date.now();
            } else {
                pfpElement.src = profilepic;
            }

            // Update page title
            const typeLabel = CheckIfUser() ? "The Photographer" : "The Photographer (adm)";
            document.title = typeLabel;
        } catch (error) {
            console.error("Error loading header info:", error);
        }
    }

    function logout()
    {
        sessionStorage.clear();
        localStorage.clear();
        window.location.href ="loginuser.html";
    }

    function loadIframe(page) {
        const iframe = document.querySelector(".iframe-container iframe");
        if (iframe) {
            iframe.src = page;
        }

        // Close sidebar and overlay
        document.getElementById("sidebar").classList.remove("active");
        document.getElementById("overlay").classList.remove("active");
    }

    window.addEventListener("message", (event) => {
        if (event.data.action === "backToMain") {
            document.querySelector("iframe").src = "allphotos.html";
        }
    });

    function openMyProfile() {
        const userid = sessionStorage.getItem("userid");
        if (!userid) {
            alert("You must be logged in to view your profile.");
            return;
        }
        const iframe = document.querySelector(".iframe-container iframe");
        if (iframe) {
            iframe.src = `userarea.html?userid=${userid}`;
        }

        document.getElementById("sidebar").classList.remove("active");
        document.getElementById("overlay").classList.remove("active");
    }

    document.addEventListener("DOMContentLoaded", () => {

        const forceRefresh = sessionStorage.getItem("forceRefreshProfile") === "true";
        if (forceRefresh) {
            sessionStorage.removeItem("forceRefreshProfile");
            loadHeaderInfo(true);
        } else {
            loadHeaderInfo();
        }
        // Load header info initially
        loadHeaderInfo();

        // Check for iframe load parameter
        const params = new URLSearchParams(window.location.search);
        const iframeUrl = params.get('loadiframe');
        if (iframeUrl) {
            const iframeUrl = decodeURIComponent(params.get('loadiframe'));
            if (iframe) {
                iframe.src = iframeUrl;
            }
            // Clean up URL
            window.history.replaceState({}, document.title, window.location.pathname);

            // pass true to force refresh on header info
            loadHeaderInfo(true);
        }

    });

</script>
</body>
</html>
