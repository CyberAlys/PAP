<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photos</title>
    <script src="photos.js" ></script>
    <script src="user-adm-ver.js"></script>
</head>
<body onload="CheckLogin()">

<form id="photoupload" onsubmit="uploadpicturetophp(event)">
    <label for="text">Write something:</label>
    <input type="text" id="text"><br>

    <button type="button" onclick="toggleImageUpload()">📸 Add/Remove Image</button><br>

    <div id="image-section" style="display: none;">
        <label for="img">Select image:</label>
        <input type="file" id="img" name="img" accept="image/*"><br>
    </div>

    <input type="submit" value="Post">
</form>

</body>
</html>
