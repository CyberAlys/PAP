<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feed | The Photographer</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <!-- JS -->
    <script src="photos.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadFeed();

            const feed = document.querySelector("#post-feed");
            if (!feed) {
                console.error("#post-feed not found!");
                return;
            }

            feed.addEventListener("click", function (e) {
                const postElement = e.target.closest(".post");
                if (postElement && postElement.hasAttribute("data-postid")) {
                    const postId = postElement.getAttribute("data-postid");
                    IDSubmit(postId);
                }
            });
        });
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/feed.css">
</head>
<body>
<!-- Post Template (Hidden) -->
<div class="post post-preview" id="post-template" style="display: none;">
    <div class="user-info">
        <img class="pfp" src="" alt="Profile Picture" />
        <h3 class="username"></h3>
    </div>
    <p class="text"></p>
    <div class="photo-container">
        <img class="photo" src="" alt="Post Photo" />
    </div>
</div>

<!-- Feed Container -->
<div id="post-feed"></div>
</body>
</html>
