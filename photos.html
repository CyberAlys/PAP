<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Upload | The Photographer</title>

    <!-- style-->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link href="css/upload.css" rel="stylesheet">

    <!-- Scripts -->
    <script src="photos.js" defer></script>
    <script src="user-adm-ver.js" defer></script>
</head>
<body onload="CheckLogin()">

<div class="upload-wrapper">
    <h1>New Post</h1>

    <form id="photoupload" onsubmit="uploadpicturetophp(event)">
        <label for="text">Write something:</label>
        <input type="text" id="text"><br>

        <button type="button" onclick="toggleImageUpload()">📸 Add/Remove Image</button><br>

        <div id="image-section" style="display: none;">
            <label for="img">Select image:</label>
            <input type="file" id="img" name="img" accept="image/*"><br>
        </div>

        <input type="submit" value="Post">
        <button type="button" onclick="cancelUpload()">Cancel</button> <!-- 👈 New cancel button -->
    </form>

</div>

<script>
    function cancelUpload() {
        // If in an iframe, go back to the main feed
        if (window.top !== window.self) {
            window.parent.postMessage({ action: 'backToMain' }, '*');
        } else {
            window.location.href = 'mainpage.html';
        }
    }
</script>
</body>
</html>
