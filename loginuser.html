<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
    <script src="Loginusers.js"> </script>
    <script>

    </script>
    <style>
        form {

            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 250px; /* Optional: Limit form width */
        }

        input, textarea, button {
            padding: 3px;
            font-size: 10px;
        }
    </style>

</head>
<body>
    <form id="login" action="login.php?type=login" method="post">
        <input type="text" id="user" name="user" placeholder="Username" required>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <input type="button" value="Show Password" id="showpass" onclick="showPassword()">
        <input type="submit" value="Log in">
    </form>

    <form id="register" action="login.php?type=register" method="post">
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <input type="password" placeholder="Confirm password" required>
        <input type="text" placeholder="Name" required>
        <input type="text" placeholder="Email" required>
        <input type="date" placeholder="Birthday" required>

        <input type="submit" value="Register">
    </form>
    <h6>You don't have an account yet? <a id="RegisterText" onclick="">Register</a></h6>
    <h6>You alread have an account <a id="LoginText" onclick="">Log-In</a></h6>

</body>
</html>
